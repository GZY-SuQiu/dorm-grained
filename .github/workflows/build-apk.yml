name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept SDK licenses and install components
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK (debug, auto-signed & installable)
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dorm-duty
          path: app/build/outputs/apk/debug/*.apk

      # 把 APK 用 git 推到独立 dist 分支，供沙箱经 api.github.com 直接拉取
      # （GitHub artifact CDN 在部分网络下被墙，这条通道更稳；
      #   用 git 协议而非 Contents API，因为细粒度 token 的 Contents 建文件会 404）
      - name: Push APK to dist branch
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "pushing $APK ($(stat -c%s "$APK") bytes) to dist branch"
          cp "$APK" dorm-duty.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add dorm-duty.apk
          git commit -m "ci: dorm-duty.apk ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin dist
          echo "dist branch updated"