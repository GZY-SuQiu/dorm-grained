name: Build APK

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept SDK licenses and install components
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK (debug, auto-signed & installable)
        run: |
          if gradle assembleDebug --no-daemon > build-output.log 2>&1; then
            echo "BUILD OK"
            tail -3 build-output.log
          else
            echo "BUILD FAILED — 完整日志已存到 dist 分支（build-error.log）"
            tail -100 build-output.log
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            cp build-output.log build-error.log
            git add -f build-error.log
            git commit -m "ci: build error log $(date -u +%H:%M:%SZ)" || true
            git branch -f dist
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force origin dist || echo "WARN: 无法推送错误日志到 dist"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dorm-duty
          path: app/build/outputs/apk/debug/*.apk

      # 把 APK 用 git 推到独立 dist 分支，供沙箱经 api.github.com 直接拉取
      # （GitHub artifact CDN 在部分网络下被墙；.gitignore 忽略了 *.apk，需 -f 强制加）
      - name: Push APK to dist branch
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK ($(stat -c%s "$APK") bytes)"
          cp "$APK" dorm-duty.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dorm-duty.apk
          git commit -m "ci: dorm-duty.apk ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git branch -f dist
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git push --force origin dist 2>push.log; then
            echo "dist branch pushed"
          else
            echo "PUSH FAILED:"; cat push.log; exit 1
          fi