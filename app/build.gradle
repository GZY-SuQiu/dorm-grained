plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dorm.duty'
    compileSdk 35

    defaultConfig {
        applicationId "com.dorm.duty"
        minSdk 26
        targetSdk 35
        versionCode 25
        versionName "5.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
}